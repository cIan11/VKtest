services:
  postgres:
    image: postgres:16-alpine
    container_name: vktask-postgres
    environment:
      POSTGRES_DB: vktask
      POSTGRES_USER: vktask
      POSTGRES_PASSWORD: vktask
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vktask -d vktask"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: vktask-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vktask
      SPRING_DATASOURCE_USERNAME: vktask
      SPRING_DATASOURCE_PASSWORD: vktask
    ports:
      - "8080:8080"

volumes:
  postgres-data:
